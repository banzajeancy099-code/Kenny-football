name: Multi-window (17h, 20h, 22h30, 23h55, 04h05)

on:
  schedule:
    # 17h UTC - 1er snapshot cotes du soir
    - cron: '0 17 * * *'
    # 20h UTC - 2e snapshot (détection mouvement)
    - cron: '0 20 * * *'
    # 22h30 UTC - 3e snapshot (cotes finales)
    - cron: '30 22 * * *'
    # 23h55 UTC - réveil nuit
    - cron: '55 23 * * *'
    # 04h05 UTC - fin de nuit
    - cron: '5 4 * * *'
  workflow_dispatch:

jobs:
  wake-and-refresh:
    if: |
      github.event.schedule == '0 17 * * *' ||
      github.event.schedule == '0 20 * * *' ||
      github.event.schedule == '30 22 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Wake + refresh cotes
        run: |
          echo "🌆 Réveil pour snapshot cotes"
          curl -s -o /dev/null -w "Wake : HTTP %{http_code}\n" \
            https://kenny-football.onrender.com/api/health
          sleep 10
          curl -s -X POST -o /dev/null -w "Refresh : HTTP %{http_code}\n" \
            https://kenny-football.onrender.com/api/cron/trigger/refresh

  night-window:
    if: |
      github.event.schedule == '55 23 * * *' ||
      github.event.schedule == '5 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping nuit (23h55-04h05)
        run: |
          for i in $(seq 1 50); do
            curl -s -o /dev/null -w "Ping $i : HTTP %{http_code}\n" \
              https://kenny-football.onrender.com/api/health
            sleep 300
          done
