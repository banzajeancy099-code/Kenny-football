name: Kenny Football Cron

on:
  schedule:
    # 23h55 UTC — Analyse des matchs du jour
    - cron: '55 23 * * *'
    # 04h00 UTC — Vérification des résultats J-1
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    if: github.event.schedule == '55 23 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Réveil Render + Analyse
        run: |
          echo "=== Réveil Render ==="
          curl -s --max-time 60 https://kenny-football.onrender.com/api/health
          echo ""
          echo "=== Analyse ==="
          curl -s -X POST --max-time 120 https://kenny-football.onrender.com/api/analyze/start

  verification:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 4 * * *'
    steps:
      - name: Réveil Render + Vérification
        run: |
          echo "=== Réveil Render ==="
          curl -s --max-time 60 https://kenny-football.onrender.com/api/health
          echo ""
          DATE=$(date -u -d 'yesterday' +%Y-%m-%d)
          echo "=== Vérification $DATE ==="
          curl -s --max-time 120 https://kenny-football.onrender.com/api/resultats/$DATE
