name: Kenny Football Cron

on:
  schedule:
    - cron: '55 23 * * *'   # analyse du jour
    - cron: '0 4 * * *'     # vérification résultats
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.schedule == '55 23 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Analyse du jour
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          BZZOIRO_API_KEY_5: ${{ secrets.BZZOIRO_API_KEY_5 }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PYTHONPATH: src
        run: |
          python -m jobs.kjob_analyse $(date +%Y-%m-%d)

  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '0 4 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Vérification résultats J-1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          BZZOIRO_API_KEY_5: ${{ secrets.BZZOIRO_API_KEY_5 }}
          PYTHONPATH: src
        run: |
          python -m jobs.kjob_verif $(date -u -d 'yesterday' +%Y-%m-%d)
