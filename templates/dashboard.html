<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kenny Football — Pronostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { padding-bottom: 90px; }
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
        .tab-active { color: #10b981; }
        .tab-active .tab-icon { transform: scale(1.15); }
        .fade-in { animation: fadeIn .25s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <header class="bg-gray-800/90 backdrop-blur border-b border-gray-700 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-white">⚽ Kenny Football</h1>
                <p class="text-xs text-gray-400" id="scheduler-status">—</p>
            </div>
            <button id="btn-analyze" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white text-sm font-bold px-3 py-2 rounded-lg">
                <span id="btn-analyze-text">🔍 Analyser</span>
                <span id="btn-analyze-progress" class="hidden ml-1 text-xs"></span>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">

        <section id="view-home" class="view fade-in">
            <div id="home-status" class="text-gray-400 text-sm mb-4"></div>
            <div id="home-stats" class="grid grid-cols-2 gap-3 mb-4"></div>
            <div id="home-results"></div>
        </section>

        <section id="view-history" class="view hidden fade-in">
            <h2 class="text-lg font-bold text-white mb-4">📜 Historique</h2>
            <div id="history-global-stats" class="grid grid-cols-3 gap-3 mb-4"></div>
            <div id="history-list" class="space-y-2"></div>
            <div id="history-detail" class="mt-6"></div>
        </section>

        <section id="view-subscription" class="view hidden fade-in">
            <h2 class="text-lg font-bold text-white mb-4">💎 Abonnement</h2>
            <div class="bg-gray-800 rounded-xl p-6 text-center border border-gray-700">
                <p class="text-gray-400 mb-4">Formule Pro — accès aux 24 couches, alertes Telegram, mises Kelly illimitées.</p>
                <button class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-lg font-bold text-white">
                    Bientôt disponible
                </button>
                <p class="text-xs text-gray-500 mt-4">Version gratuite : 6 couches · 13 ligues · refresh 30 min</p>
            </div>
        </section>

        <section id="view-menu" class="view hidden fade-in">
            <h2 class="text-lg font-bold text-white mb-4">☰ Menu</h2>
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 space-y-3 text-sm">
                <div class="flex justify-between"><span class="text-gray-400">Version</span><span id="menu-version">—</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Couches actives</span><span id="menu-layers">—</span></div>
                <div class="flex justify-between"><span class="text-gray-400">API-Football</span><span id="menu-apifb">—</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Scheduler</span><span id="menu-scheduler">—</span></div>
                <div class="flex justify-between"><span class="text-gray-400">Jobs</span><span id="menu-jobs">—</span></div>
                <hr class="border-gray-700">
                <a href="/api/cron/status" target="_blank" class="block text-emerald-400 hover:underline">→ /api/cron/status</a>
                <a href="/api/health" target="_blank" class="block text-emerald-400 hover:underline">→ /api/health</a>
                <a href="/api/stats" target="_blank" class="block text-emerald-400 hover:underline">→ /api/stats</a>
            </div>
        </section>
    </main>

    <nav class="bottom-nav fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 z-40">
        <div class="max-w-6xl mx-auto grid grid-cols-4">
            <button data-tab="home" class="tab tab-active py-3 flex flex-col items-center text-xs font-bold transition">
                <span class="tab-icon text-xl">🏠</span><span>Accueil</span>
            </button>
            <button data-tab="history" class="tab py-3 flex flex-col items-center text-xs font-bold text-gray-400 transition">
                <span class="tab-icon text-xl">📜</span><span>Historique</span>
            </button>
            <button data-tab="subscription" class="tab py-3 flex flex-col items-center text-xs font-bold text-gray-400 transition">
                <span class="tab-icon text-xl">💎</span><span>Abonnement</span>
            </button>
            <button data-tab="menu" class="tab py-3 flex flex-col items-center text-xs font-bold text-gray-400 transition">
                <span class="tab-icon text-xl">☰</span><span>Menu</span>
            </button>
        </div>
    </nav>

    <script>
    function switchTab(tab) {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        document.getElementById('view-' + tab).classList.remove('hidden');
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.remove('tab-active', 'text-emerald-400');
            t.classList.add('text-gray-400');
        });
        const active = document.querySelector(`.tab[data-tab="${tab}"]`);
        active.classList.remove('text-gray-400');
        active.classList.add('tab-active');
        if (tab === 'history') loadHistory();
        if (tab === 'menu') loadMenu();
    }
    document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => switchTab(t.dataset.tab));
    });

    function fmtTime(iso) {
        if (!iso) return '';
        try { return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); } catch { return ''; }
    }
    function fmtDate(iso) {
        if (!iso) return '';
        try { return new Date(iso).toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short' }); } catch { return iso; }
    }

    function renderMatch(m, retenu) {
        const border = retenu ? 'border-emerald-600' : 'border-gray-700';
        const badge = retenu ? 'bg-emerald-600' : 'bg-gray-600';
        const kickoff = fmtTime(m.kickoff);
        const score = Number(m.score ?? 0).toFixed(2);
        const proba = ((m.proba_over ?? 0) * 100).toFixed(0);
        const edge = Number(m.edge ?? 0).toFixed(2);
        const coteRaw = m.cote_over ?? '—';
        const cSrc = m.cote_source || '';
        let coteBadge = '';
        if (cSrc.startsWith('estimated')) coteBadge = '<span class="text-yellow-500 text-xs" title="Cote estimée (Bzzoiro pas encore publiée)">~</span>';
        else if (cSrc.startsWith('default')) coteBadge = '<span class="text-red-400 text-xs" title="Aucune cote disponible">⚠️</span>';
        const cote = `${coteRaw}${coteBadge}`;
        const mise = Number(m.mise_kelly ?? 0).toFixed(2);
        const league = m.league_name || (m.league_id ? `Ligue ${m.league_id}` : 'Ligue inconnue');
        return `
            <div class="bg-gray-800 rounded-xl p-4 border ${border} mb-3">
                <div class="flex justify-between items-start mb-2">
                    <div class="flex-1 pr-2">
                        <div class="font-bold text-white">${m.home || '?'} <span class="text-gray-500">vs</span> ${m.away || '?'}</div>
                        <div class="text-xs text-gray-400 mt-1">${league}${kickoff ? ' · ' + kickoff : ''}</div>
                    </div>
                    <span class="${badge} text-white px-3 py-1 rounded-full text-sm font-bold whitespace-nowrap">${score}</span>
                </div>
                <div class="grid grid-cols-4 gap-2 text-xs mt-3">
                    <div class="bg-gray-700 rounded p-2 text-center">
                        <div class="text-gray-400">Over</div><div class="text-white font-bold">${proba}%</div>
                    </div>
                    <div class="bg-gray-700 rounded p-2 text-center">
                        <div class="text-gray-400">Edge</div>
                        <div class="${(m.edge ?? 0) > 0 ? 'text-emerald-400' : 'text-red-400'} font-bold">${edge}</div>
                    </div>
                    <div class="bg-gray-700 rounded p-2 text-center">
                        <div class="text-gray-400">Cote</div><div class="text-white font-bold">${cote}</div>
                    </div>
                    <div class="bg-gray-700 rounded p-2 text-center">
                        <div class="text-gray-400">Mise</div><div class="text-white font-bold">${mise}€</div>
                    </div>
                </div>
            </div>`;
    }

    async function loadHome() {
        const status = document.getElementById('home-status');
        const stats = document.getElementById('home-stats');
        const results = document.getElementById('home-results');
        status.textContent = '⏳ Chargement...';
        stats.innerHTML = '';
        results.innerHTML = '';
        try {
            const res = await fetch('/api/predictions');
            const data = await res.json();
            const matches = data.matches || [];
            const retenus = matches.filter(m => m.retenu);
            const rejetes = matches.filter(m => !m.retenu);
            if (matches.length === 0) {
                status.innerHTML = `📭 Aucune prédiction encore.<br><span class="text-xs text-gray-500">Le cron tourne à 00h, ou clique sur 🔍 Analyser.</span>`;
            } else {
                status.textContent = `✅ ${matches.length} matchs · ${retenus.length} retenus · maj ${fmtTime(data.last_update)}`;
            }
            stats.innerHTML = `
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <div class="text-2xl font-bold text-emerald-400">${retenus.length}</div>
                    <div class="text-sm text-gray-400">Retenus</div>
                </div>
                <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
                    <div class="text-2xl font-bold text-gray-300">${matches.length}</div>
                    <div class="text-sm text-gray-400">Analysés</div>
                </div>`;
            if (retenus.length > 0) {
                results.innerHTML += `<h2 class="text-lg font-bold text-emerald-400 mb-3 mt-4">✅ Retenus (score ≥ 8)</h2>`;
                results.innerHTML += retenus.map(m => renderMatch(m, true)).join('');
            }
            if (rejetes.length > 0) {
                results.innerHTML += `<h2 class="text-lg font-bold text-gray-400 mb-3 mt-6">❌ Rejetés</h2>`;
                results.innerHTML += rejetes.map(m => renderMatch(m, false)).join('');
            }
        } catch (e) { status.textContent = '❌ ' + e.message; }
    }

    document.getElementById('btn-analyze').addEventListener('click', analyzeStart);

    async function analyzeStart() {
        const btn = document.getElementById('btn-analyze');
        const txt = document.getElementById('btn-analyze-text');
        const prog = document.getElementById('btn-analyze-progress');
        const status = document.getElementById('home-status');
        btn.disabled = true;
        txt.textContent = '⏳ Démarrage...';
        status.textContent = '🔍 Récupération + pré-filtre...';
        try {
            const res = await fetch('/api/analyze/start?limit=200', { method: 'POST' });
            const data = await res.json();
            if (!data.success) {
                status.textContent = '⚠️ ' + (data.error || 'Erreur');
                btn.disabled = false; txt.textContent = '🔍 Analyser';
                return;
            }
            status.textContent = `📊 ${data.total_bzzoiro} Bzzoiro → ${data.filtered} analysables...`;
            pollJob(data.job_id);
        } catch (e) {
            status.textContent = '❌ ' + e.message;
            btn.disabled = false; txt.textContent = '🔍 Analyser';
        }
    }

    async function pollJob(jobId) {
        const btn = document.getElementById('btn-analyze');
        const txt = document.getElementById('btn-analyze-text');
        const prog = document.getElementById('btn-analyze-progress');
        const status = document.getElementById('home-status');
        while (true) {
            try {
                const res = await fetch(`/api/analyze/status/${jobId}`);
                const j = await res.json();
                if (j.status === 'running' || j.status === 'queued') {
                    const done = j.done || 0, total = j.total || 0;
                    const pct = total ? Math.round(done * 100 / total) : 0;
                    txt.textContent = '⏳ Analyse';
                    prog.textContent = `${done}/${total}`;
                    prog.classList.remove('hidden');
                    status.textContent = `⚙️ ${done}/${total} (${pct}%) · ${j.retenus || 0} retenus`;
                } else if (j.status === 'done') {
                    status.textContent = `✅ ${j.total} analysés · ${j.retenus} retenus`;
                    break;
                } else if (j.status === 'error') {
                    status.textContent = '❌ ' + (j.error || 'Erreur job');
                    break;
                }
            } catch (e) { status.textContent = '❌ ' + e.message; break; }
            await new Promise(r => setTimeout(r, 3000));
        }
        btn.disabled = false;
        txt.textContent = '🔍 Analyser';
        prog.classList.add('hidden');
        loadHome();
    }

    async function loadHistory() {
        const list = document.getElementById('history-list');
        const detail = document.getElementById('history-detail');
        const gs = document.getElementById('history-global-stats');
        list.innerHTML = '⏳ Chargement...';
        detail.innerHTML = '';
        gs.innerHTML = '';
        try {
            const sRes = await fetch('/api/stats');
            const stats = await sRes.json();
            if (stats.total_verified > 0) {
                gs.innerHTML = `
                    <div class="bg-gray-800 rounded-lg p-3 border border-gray-700 text-center">
                        <div class="text-2xl font-bold text-emerald-400">${stats.total_correct}</div>
                        <div class="text-xs text-gray-400">✓ Corrects</div>
                    </div>
                    <div class="bg-gray-800 rounded-lg p-3 border border-gray-700 text-center">
                        <div class="text-2xl font-bold text-red-400">${stats.total_wrong}</div>
                        <div class="text-xs text-gray-400">× Ratés</div>
                    </div>
                    <div class="bg-gray-800 rounded-lg p-3 border border-gray-700 text-center">
                        <div class="text-2xl font-bold text-white">${(stats.accuracy * 100).toFixed(1)}%</div>
                        <div class="text-xs text-gray-400">Précision</div>
                    </div>`;
            }
            const res = await fetch('/api/history');
            const data = await res.json();
            const items = data.history || [];
            if (items.length === 0) {
                list.innerHTML = `<div class="text-gray-500 text-sm">Aucun historique.</div>`;
                return;
            }
            list.innerHTML = items.map(it => {
                const v = it.verified || 0, c = it.correct || 0, w = it.wrong || 0;
                const badge = v > 0
                    ? `<span class="text-emerald-400">${c}✓</span> <span class="text-red-400">${w}×</span>`
                    : `<span class="text-gray-500">—</span>`;
                return `
                    <button onclick="loadHistoryDetail('${it.date}')" class="w-full text-left bg-gray-800 hover:bg-gray-750 border border-gray-700 rounded-lg p-3 transition">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="font-bold text-white">${fmtDate(it.date)}</div>
                                <div class="text-xs text-gray-500">${it.total} matchs · maj ${fmtTime(it.last_update)}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-bold">${badge}</div>
                                <div class="text-xs text-gray-400">${it.retenus} retenus</div>
                            </div>
                        </div>
                    </button>`;
            }).join('');
        } catch (e) { list.innerHTML = '❌ ' + e.message; }
    }

    async function loadHistoryDetail(d) {
        const detail = document.getElementById('history-detail');
        detail.innerHTML = '⏳ Chargement...';
        try {
            const res = await fetch('/api/predictions/' + d);
            const data = await res.json();
            const matches = data.matches || [];
            const retenus = matches.filter(m => m.retenu);
            const rejetes = matches.filter(m => !m.retenu);
            let html = `<h3 class="text-md font-bold text-white mb-3">${fmtDate(d)} — ${retenus.length} retenus / ${matches.length}</h3>`;
            html += `<button onclick="verifierResultats('${d}')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-3 py-2 rounded-lg mb-4">🔍 Vérifier les résultats</button>`;
            if (retenus.length) {
                html += `<h4 class="text-sm font-bold text-emerald-400 mb-2">✅ Retenus</h4>`;
                html += retenus.map(m => renderMatchWithResult(m, true)).join('');
            }
            if (rejetes.length) {
                html += `<h4 class="text-sm font-bold text-gray-400 mb-2 mt-4">❌ Rejetés</h4>`;
                html += rejetes.map(m => renderMatchWithResult(m, false)).join('');
            }
            detail.innerHTML = html;
            detail.scrollIntoView({ behavior: 'smooth' });
        } catch (e) { detail.innerHTML = '❌ ' + e.message; }
    }

    function renderMatchWithResult(m, retenu) {
        const base = renderMatch(m, retenu);
        if (!m.result) return base;
        const r = m.result;
        const vColor = r.verdict === '✓' ? 'text-emerald-400' : (r.verdict === '×' ? 'text-red-400' : 'text-gray-400');
        const vBg = r.verdict === '✓' ? 'bg-emerald-900' : (r.verdict === '×' ? 'bg-red-900' : 'bg-gray-800');
        const sColor = r.over_2_5_real ? 'text-emerald-300' : 'text-gray-300';
        const inj = `
            <div class="${vBg} border border-gray-700 rounded-lg p-2 mt-2 flex justify-between items-center text-xs">
                <div>
                    <span class="text-gray-400">Score réel :</span>
                    <span class="${sColor} font-bold">${r.home_score}-${r.away_score}</span>
                    <span class="text-gray-500">(${r.total_goals} buts)</span>
                    <span class="text-gray-400 ml-2">Prédit :</span>
                    <span class="text-white">${(r.proba * 100).toFixed(0)}% Over</span>
                </div>
                <div class="${vColor} text-2xl font-bold">${r.verdict}</div>
            </div>`;
        return base.replace(/<\/div>\s*$/, inj + '</div>');
    }

    async function verifierResultats(d) {
        try {
            const res = await fetch('/api/resultats/' + d, { method: 'POST' });
            const data = await res.json();
            if (data.success) loadHistoryDetail(d);
            else alert('Erreur : ' + data.error);
        } catch (e) { alert('Erreur : ' + e.message); }
    }

    async function loadMenu() {
        try {
            const [hRes, cRes] = await Promise.all([fetch('/api/health'), fetch('/api/cron/status')]);
            const h = await hRes.json();
            const c = await cRes.json();
            document.getElementById('menu-version').textContent = h.version || '—';
            document.getElementById('menu-layers').textContent = h.layers ?? '—';
            document.getElementById('menu-apifb').textContent = h.api_football || '—';
            document.getElementById('menu-scheduler').textContent = c.scheduler_running ? '✅ running' : '⏸ stopped';
            document.getElementById('menu-jobs').textContent = (c.jobs || []).map(j => j.id).join(', ') || '—';
            document.getElementById('scheduler-status').textContent = c.scheduler_running ? '⏰ Scheduler actif' : '⏸ Scheduler arrêté';
        } catch (e) { console.error(e); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadHome();
        loadMenu();
        setInterval(() => {
            if (!document.getElementById('view-home').classList.contains('hidden')) loadHome();
        }, 60000);
    });
    </script>
</body>
</html>
